<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Air Attack</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Joystix", monospace; color: #fff; }
  #wrap { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; background: #000; }
  #screen { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; background: #000; image-rendering: auto; touch-action: none; user-select: none; }
  #title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b1b33; }
  #title h1 { font-size: 64px; letter-spacing: 4px; margin: 0 0 40px; color: #ffd84a; text-shadow: 4px 4px 0 #8a2a00; }
  #loading { width: 360px; height: 14px; border: 2px solid #fff; margin-bottom: 18px; }
  #bar { height: 100%; width: 0; background: #ffd84a; }
  #status { min-height: 24px; font-size: 14px; color: #f88; }
  #start { display: none; font: inherit; font-size: 34px; padding: 14px 56px; cursor: pointer; background: #ffd84a; color: #1a1a1a; border: 4px solid #fff; }
  #start:hover { background: #fff; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.55); }
  #overlay.show { display: flex; }
  .panel { background: #14263f; border: 4px solid #ffd84a; padding: 26px 34px; min-width: 460px; max-width: 760px; font-size: 18px; line-height: 1.5; }
  .panel.wide { min-width: 640px; }
  .panel h2 { margin: 0 0 16px; font-size: 26px; color: #ffd84a; }
  .panel p { margin: 0 0 14px; } .panel .pc { color: #9fd3ff; font-size: 15px; }
  .panel table { width: 100%; border-collapse: collapse; margin-bottom: 14px; font-size: 15px; }
  .panel th, .panel td { text-align: left; padding: 3px 8px; border-bottom: 1px solid #36507a; }
  .row { display: flex; gap: 14px; align-items: center; justify-content: center; margin-top: 12px; }
  .row .pg { font-size: 14px; opacity: .8; }
  .panel button { font: inherit; font-size: 18px; padding: 8px 20px; cursor: pointer; background: #ffd84a; color: #111; border: 3px solid #fff; }
  .panel button:disabled { opacity: .35; cursor: default; }
  .panel label { display: block; margin: 10px 0; } .panel input, .panel select { font: inherit; font-size: 16px; }
    #fatal { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px; background: #800; display: none; font-size: 14px; }
  #fps { position: absolute; left: 8px; top: 6px; font-size: 13px; color: #9fd3ff; background: rgba(0,0,0,.5); padding: 2px 6px; pointer-events: none; }
  #hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 13px; opacity: .65; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="1280" height="720"></canvas>
  <div id="title">
    <h1>AIR ATTACK</h1>
    <div id="loading"><div id="bar"></div></div>
    <div id="status"></div>
    <button id="start">START</button>
    <div id="hint">Mouse: tap = fire &middot; hold left/right of soldier = walk &middot; swipe up = jump &middot; hold on soldier = dig &nbsp;|&nbsp; Keys: A/D or arrows = walk, Space / W = jump, Z = fire, F = fps, Esc = pause</div>
  </div>
  <div id="overlay"></div>
    <div id="fatal"></div>
  <div id="fps" style="display:none"></div>
</div>
<script>
  // fixed 1280x720 game surface, uniformly scaled to fit the window
  function fit() { const s = Math.min(innerWidth / 1280, innerHeight / 720); document.getElementById("wrap").style.transform = "scale(" + s + ") translate(-50%,-50%)"; document.getElementById("wrap").style.transformOrigin = "0 0"; }
  addEventListener("resize", fit); fit();
</script>
<script src="game-bundle.js"></script>
</body>
</html>
